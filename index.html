<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرع المعلومات - C++ Run</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .console {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            margin: 20px auto;
            border-radius: 12px;
            text-align: left;
            direction: ltr;
            box-shadow: 0px 8px 24px rgba(0, 255, 0, 0.15);
            font-size: 1.1rem;
            border: 1px solid #00ff0033;
        }
        .arabic-text {
            direction: rtl;
            text-align: right;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin-top: 12px;
            font-size: 1.2rem;
        }
        .btn-share {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 32px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
            transition: all 0.2s ease;
            width: 100%;
            max-width: 450px;
            margin: 15px auto d;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-share:active {
            transform: scale(0.98);
            background-color: #0056b3;
        }
        .alert-box {
            display: none;
            color: #00ff00;
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .footer-link {
            margin-top: 40px;
            font-size: 0.9rem;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>C++ Console Output</h1>
    
    <div class="console">
        <p style="margin: 0;">dont play with us</p>
        <p class="arabic-text" style="margin: 0;">فرع المعلومات</p>
    </div>

    <button class="btn-share" onclick="sharePage()">مشاركة الرابط 🔗</button>
    <div id="alert" class="alert-box">✓ تم نسخ رابط الصفحة بنجاح!</div>

    <div class="footer-link">
        <p>الموقع الرسمي: <a href="https://www.onlinegdb.com/" target="_blank">OnlineGDB</a></p>
    </div>

    <script>
        async function sharePage() {
            const shareData = {
                title: 'فرع المعلومات',
                text: 'dont play with us - C++ Run',
                url: window.location.href
            };

            // If the phone supports native mobile sharing (like WhatsApp/Telegram sheets)
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('Native share dismissed or failed, falling back to copy.');
                }
            } else {
                // Fallback for older browsers: Copy link directly to clipboard
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    showAlert();
                } catch (err) {
                    // Final backup method for strict mobile containers
                    const tempInput = document.createElement("input");
                    tempInput.value = window.location.href;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    showAlert();
                }
            }
        }

        function showAlert() {
            const alertBox = document.getElementById("alert");
            alertBox.style.display = "block";
            setTimeout(() => {
                alertBox.style.display = "none";
            }, 3000);
        }
    </script>

</body>
</html>
